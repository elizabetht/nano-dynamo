[project]
name = "nano-dynamo"
dynamic = ["version"]
description = "A minimal, from-scratch teaching implementation of Dynamo's orchestration layer."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["nano_dynamo*"]

[tool.setuptools_scm]
# Version is derived from the latest git tag (v0.1.0 -> 0.1.0). fallback_version
# keeps builds from a gitless copy (no tags, no PKG-INFO) from hard-failing.
fallback_version = "0.0.0"

[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"
